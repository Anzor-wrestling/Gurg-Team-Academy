name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: gurgteam.asia
      - name: Notify Yandex and Bing (IndexNow)
        continue-on-error: true
        run: |
          sleep 60
          curl -sS -X POST https://yandex.com/indexnow -H "Content-Type: application/json" \
            -d '{"host":"gurgteam.asia","key":"19737bdc5de13e283c8af91d6b939623","keyLocation":"https://gurgteam.asia/19737bdc5de13e283c8af91d6b939623.txt","urlList":["https://gurgteam.asia/"]}' -w " yandex %{http_code}\n"
          curl -sS -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json" \
            -d '{"host":"gurgteam.asia","key":"19737bdc5de13e283c8af91d6b939623","keyLocation":"https://gurgteam.asia/19737bdc5de13e283c8af91d6b939623.txt","urlList":["https://gurgteam.asia/"]}' -w " indexnow %{http_code}\n"
